<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>생성 · 제거 (리소스 정리)</title>
  <link rel="stylesheet" href="./asset/examples.css" />
</head>

<body class="example-page">
  <header class="page-header">
    <div><a href="./index.html">DaraDialog / UI 테스트</a>
      <h1>생성 · 제거 (리소스 정리)</h1>
    </div>
    <div class="page-header-actions">테마 <select data-theme-select aria-label="테마"><option value="light">light</option><option value="dark">dark</option></select></div>
  </header>

  <main>
    <section class="example-content">
      <h2>반복 생성 · 제거</h2>
      <p><code>destroy()</code> 는 DOM · 모달 overlay · 이벤트 · 지연 타이머를 모두 정리한다. 실행 전후 개수가 같아야 정상이다.</p>
      <div class="actions">
        <label style="display: flex; align-items: center; gap: 6px">횟수 <input id="count" type="number" value="200" min="1" max="5000" style="width: 100px" /></label>
        <button type="button" class="primary" id="run">실행</button>
        <button type="button" id="dragDestroy">drag 중 destroy</button>
      </div>
    </section>

    <section class="example-content">
      <div class="panel-title">결과 <button type="button" data-clear="log">지우기</button></div>
      <pre class="log" id="log" role="status" aria-live="polite"></pre>
    </section>
  </main>

  <script type="module">
    import Dialog from "/src/index.js";
    import { createLog, countDialogDom } from "./asset/page.js";

    const log = createLog("log");
    const fmt = ({ wrapper, overlay }) => `wrapper ${wrapper} · overlay ${overlay}`;

    document.getElementById("run").addEventListener("click", () => {
      const n = Math.min(5000, Math.max(1, Number(document.getElementById("count").value) || 1));
      const before = countDialogDom();
      const started = performance.now();
      for (let i = 0; i < n; i++) {
        const d = Dialog.create({ isModal: i % 2 === 0, title: "t" + i, resizable: true, template: "<p>x</p>", buttons: [{ label: "ok" }] });
        d.hide();
        d.show();
        d.destroy();
      }
      const after = countDialogDom();
      const ok = before.wrapper === after.wrapper && before.overlay === after.overlay;
      log(`${n}회 · ${(performance.now() - started).toFixed(0)}ms · 전 ${fmt(before)} → 후 ${fmt(after)} ${ok ? "✔" : "✘"}`);
    });

    document.getElementById("dragDestroy").addEventListener("click", () => {
      const d = Dialog.create({ title: "1초 뒤 destroy", isModal: true, width: 360, height: 180, template: "<p>헤더를 끄는 동안 destroy 된다. 그 뒤에도 페이지가 정상이어야 한다.</p>" });
      const header = d.dialogWrapperElement.querySelector(".dialog-header");
      const r = header.getBoundingClientRect();
      header.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, cancelable: true, clientX: r.left + 20, clientY: r.top + 10 }));
      document.dispatchEvent(new MouseEvent("mousemove", { bubbles: true, clientX: r.left + 60, clientY: r.top + 40 }));
      log(`drag 시작 · 등록된 이벤트 ${d.eventList.length}개 · 타이머 ${d.timerSet.size}개`);
      setTimeout(() => {
        d.destroy();
        log(`destroy · 이벤트 ${d.eventList.length}개 · 타이머 ${d.timerSet.size}개 · ${fmt(countDialogDom())}`);
      }, 1000);
    });
  </script>
</body>

</html>
